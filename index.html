<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5ef">
  <title>Daymark — your tasks, in view</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f6f0;
      --ink: #172b25;
      --muted: #77857d;
      --line: #dce5dc;
      --green: #1e765a;
      --green-dark: #145b44;
      --coral: #d76249;
      --white: #fffefa;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse at 8% 4%, rgba(211, 232, 216, .72), transparent 32rem),
        linear-gradient(145deg, #f5f7f1, var(--paper) 55%, #e9f0ea);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1060px, calc(100% - 48px)); margin: 0 auto; }
    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(23, 43, 37, .11);
    }
    .wordmark { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .mark { width: 28px; height: 28px; display: grid; place-items: center; color: white; background: var(--green); border-radius: 9px 9px 9px 3px; }
    .mark svg { width: 17px; height: 17px; }
    .local-note { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
    .local-note span { width: 7px; height: 7px; background: #57a47e; border-radius: 50%; }
    main { width: min(730px, 100%); margin: 62px auto 80px; animation: arrive .55s ease-out both; }
    .eyebrow { margin: 0 0 12px; color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 0; font: 400 clamp(42px, 7vw, 62px)/1.04 var(--serif); letter-spacing: -.8px; }
    .subtitle { margin: 14px 0 29px; color: var(--muted); font-size: 14px; }
    .summary { display: flex; align-items: center; gap: 10px; margin-bottom: 23px; }
    .summary-count { font: 400 20px var(--serif); }
    .summary-label { color: var(--muted); font-size: 13px; }
    .summary-rule { width: 1px; height: 18px; margin: 0 3px; background: var(--line); }
    .summary-done { color: var(--green); font-size: 12px; font-weight: 650; }
    .composer { display: flex; gap: 10px; padding: 7px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(27, 59, 44, .045); }
    .composer input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; color: var(--ink); border: 0; outline: 0; background: transparent; font-size: 14px; }
    .composer input::placeholder { color: #9aa79e; }
    .add-button { min-width: 104px; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 0 15px; border: 0; border-radius: 7px; color: white; background: var(--green); font-weight: 650; font-size: 13px; cursor: pointer; transition: background .16s, transform .16s; }
    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(.97); }
    .add-button svg { width: 16px; height: 16px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 34px 0 12px; }
    .filters { display: flex; gap: 5px; }
    .filter { padding: 8px 11px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 12px; cursor: pointer; }
    .filter:hover { color: var(--ink); }
    .filter[aria-pressed="true"] { color: var(--green-dark); background: #e1eee5; font-weight: 700; }
    .clear-button { padding: 7px 0 7px 10px; border: 0; color: var(--muted); background: transparent; font-size: 12px; cursor: pointer; }
    .clear-button:hover:not(:disabled) { color: var(--coral); }
    .clear-button:disabled { opacity: .45; cursor: default; }
    .task-list { border-top: 1px solid var(--line); }
    .task-row { min-height: 66px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 13px; border-bottom: 1px solid var(--line); animation: arrive .25s ease-out both; }
    .check-button { width: 21px; height: 21px; display: grid; place-items: center; padding: 0; border: 1.5px solid #b8c8bc; border-radius: 50%; background: transparent; cursor: pointer; transition: .16s; }
    .check-button:hover { border-color: var(--green); background: #e8f2e9; }
    .check-button svg { width: 13px; height: 13px; color: white; opacity: 0; }
    .task-row.completed .check-button { border-color: var(--green); background: var(--green); }
    .task-row.completed .check-button svg { opacity: 1; }
    .task-text { overflow-wrap: anywhere; padding: 20px 0; font-size: 14px; line-height: 1.45; }
    .completed .task-text { color: #98a49c; text-decoration: line-through; text-decoration-color: #aebbb2; }
    .task-actions { display: flex; align-items: center; gap: 3px; }
    .icon-button { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; color: #89958d; background: transparent; cursor: pointer; opacity: 0; transition: .16s; }
    .task-row:hover .icon-button, .icon-button:focus-visible { opacity: 1; }
    .icon-button:hover { color: var(--ink); background: #e7eee8; }
    .icon-button.delete:hover { color: var(--coral); background: #f7e8e4; }
    .icon-button svg { width: 16px; height: 16px; }
    .edit-input { width: 100%; margin: 12px 0; padding: 9px 10px; border: 1px solid #9ab7a1; border-radius: 5px; outline: 2px solid rgba(30, 118, 90, .12); color: var(--ink); background: var(--white); font-size: 14px; }
    .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
    .empty-mark { width: 42px; height: 42px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 13px; color: var(--green); background: #e4eee5; }
    .empty-mark svg { width: 21px; height: 21px; }
    .empty p { margin: 0; font-size: 13px; }
    footer { margin-top: 22px; color: #99a49c; text-align: center; font-size: 11px; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 560px) {
      .shell { width: min(100% - 32px, 730px); }
      header { height: 64px; }
      main { margin-top: 45px; }
      .subtitle { margin-bottom: 24px; }
      .composer { gap: 3px; }
      .composer input { padding: 0 8px; font-size: 13px; }
      .add-button { min-width: 48px; padding: 0 12px; }
      .add-button span { display: none; }
      .toolbar { margin-top: 27px; }
      .filter { padding: 8px; }
      .task-row { gap: 10px; }
      .icon-button { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="wordmark">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m6 12 4 4L18 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Daymark
      </div>
      <div class="local-note"><span aria-hidden="true"></span>Saved on this device</div>
    </header>
    <main>
      <p class="eyebrow" id="today"></p>
      <h1>A little more<br>intention.</h1>
      <p class="subtitle">Make room for what matters today.</p>
      <div class="summary" aria-live="polite">
        <span class="summary-count" id="remaining-count">0</span>
        <span class="summary-label">left to do</span>
        <span class="summary-rule" aria-hidden="true"></span>
        <span class="summary-done" id="done-count">0 completed</span>
      </div>
      <form class="composer" id="task-form">
        <input id="task-input" type="text" maxlength="240" placeholder="What needs your attention?" autocomplete="off" aria-label="New task">
        <button class="add-button" type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Add task</span>
        </button>
      </form>
      <section class="toolbar" aria-label="Task controls">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </section>
      <div class="task-list" id="task-list" aria-live="polite"></div>
      <footer>Tasks stay right here, on this device.</footer>
    </main>
  </div>
  <script>
    (() => {
      const storageKey = "daymark-tasks-v1";
      const input = document.querySelector("#task-input");
      const form = document.querySelector("#task-form");
      const list = document.querySelector("#task-list");
      const remainingCount = document.querySelector("#remaining-count");
      const doneCount = document.querySelector("#done-count");
      const clearButton = document.querySelector("#clear-completed");
      const filters = document.querySelector(".filters");
      let currentFilter = "all";
      let tasks = loadTasks();

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric"
      }).format(new Date());

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return Array.isArray(saved) ? saved.filter(task =>
            task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean"
          ) : [];
        } catch {
          return [];
        }
      }

      function persist() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(tasks));
        } catch {
          // Keep the current session usable if browser storage is unavailable.
        }
      }

      function icon(path, viewBox = "0 0 24 24") {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", viewBox);
        svg.setAttribute("fill", "none");
        svg.setAttribute("aria-hidden", "true");
        const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
        shape.setAttribute("d", path);
        shape.setAttribute("stroke", "currentColor");
        shape.setAttribute("stroke-width", "2");
        shape.setAttribute("stroke-linecap", "round");
        shape.setAttribute("stroke-linejoin", "round");
        svg.append(shape);
        return svg;
      }

      function makeButton(className, label, path) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.setAttribute("aria-label", label);
        button.title = label;
        button.append(icon(path));
        return button;
      }

      function render() {
        const visibleTasks = tasks.filter(task => {
          if (currentFilter === "active") return !task.completed;
          if (currentFilter === "completed") return task.completed;
          return true;
        });
        const remaining = tasks.filter(task => !task.completed).length;
        const completed = tasks.length - remaining;
        remainingCount.textContent = String(remaining);
        doneCount.textContent = `${completed} completed`;
        clearButton.disabled = completed === 0;
        list.replaceChildren();

        if (visibleTasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          const mark = document.createElement("span");
          mark.className = "empty-mark";
          mark.setAttribute("aria-hidden", "true");
          mark.append(icon("M8 12.5 10.8 15 16.5 9"));
          const message = document.createElement("p");
          message.textContent = tasks.length === 0 ? "A clear page. Add a task to begin." : "Nothing to see here just yet.";
          empty.append(mark, message);
          list.append(empty);
          return;
        }

        for (const task of visibleTasks) {
          const row = document.createElement("div");
          row.className = `task-row${task.completed ? " completed" : ""}`;
          const check = makeButton("check-button", task.completed ? "Mark as active" : "Mark as completed", "m5 12 4 4L19 6");
          check.setAttribute("aria-pressed", String(task.completed));
          check.addEventListener("click", () => updateTask(task.id, { completed: !task.completed }));

          const text = document.createElement("div");
          text.className = "task-text";
          text.textContent = task.text;

          const actions = document.createElement("div");
          actions.className = "task-actions";
          const edit = makeButton("icon-button", "Edit task", "M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z");
          edit.addEventListener("click", () => startEdit(task, row, text));
          const remove = makeButton("icon-button delete", "Delete task", "M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6");
          remove.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            persist();
            render();
          });
          actions.append(edit, remove);
          row.append(check, text, actions);
          list.append(row);
        }
      }

      function updateTask(id, changes) {
        tasks = tasks.map(task => task.id === id ? { ...task, ...changes } : task);
        persist();
        render();
      }

      function startEdit(task, row, text) {
        const editor = document.createElement("input");
        editor.className = "edit-input";
        editor.value = task.text;
        editor.maxLength = 240;
        editor.setAttribute("aria-label", "Edit task");
        text.replaceWith(editor);
        editor.focus();
        editor.select();
        const finish = save => {
          const value = editor.value.trim();
          if (save && value) updateTask(task.id, { text: value });
          else render();
        };
        editor.addEventListener("keydown", event => {
          if (event.key === "Enter") finish(true);
          if (event.key === "Escape") finish(false);
        });
        editor.addEventListener("blur", () => finish(true), { once: true });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        persist();
        input.value = "";
        currentFilter = "all";
        filters.querySelectorAll(".filter").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });
        render();
        input.focus();
      });

      filters.addEventListener("click", event => {
        const button = event.target.closest("[data-filter]");
        if (!button) return;
        currentFilter = button.dataset.filter;
        filters.querySelectorAll(".filter").forEach(filter => {
          filter.setAttribute("aria-pressed", String(filter === button));
        });
        render();
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        persist();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
